<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form>
        <h1>freeCodeCamp Survey Form</h1>
        <p>Thank you for taking the time to help us improve the platform</p>
        <div>
            <label for="name">Name
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </label>
        </div>
        <div>
            <label for="email">Email
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </label>
        </div>
        <div>
            <label for="age">Age(optional)
                <input type="number" id="age" name="age" placeholder="Age">
            </label>
        </div>
        <div>
            <p>Which option best describes your current role?</p>
            <select>
                <option value="">--Select current role--</option>"
                <option value="student">Student</option>
                <option value="job">Full Time job</option>
                <option value="learner">Full Time Learner</option>
                <option value="preferNo">Prefer not to say</option>
                <option value="other">Other</option>
            </select>
        </div>
        <fieldset>
            <legend>Would you recommend freecodeCamp?</legend>
            <div>
                <input type="radio" id="definitely" name="hear" value="definitely" checked />
                <label for="definitely">Definitely</label>
            </div>
            <div>
                <input type="radio" id="maybe" name="hear" value="maybe">
                <label for="maybe">Maybe</label>
            </div>
            <div>
                <input type="radio" id="not-sure" name="hear" value="not-sure">
                <label for="not sure">Not Sure</label>
            </div>
        </fieldset>
        <fieldset>
            <legend>What would you like to see improved? (Check all that apply)</legend>
            <p>
                <input type="checkbox" id="front-end" name="prefer" value="front-end-projects">
                <label for="front-end">Front-end Projects</label>

                <input type="checkbox" id="back-end" name="prefer" value="back-end-projects">
                <label for="back-end">Back-end Projects</label>

                <input type="checkbox" id="data" name="prefer" value="data-visualization">
                <label for="data">Data Visualization</label>

                <input type="checkbox" id="challenges" name="prefer" value="challenges">
                <label for="challenges">Challenges</label>

                <input type="checkbox" id="open-source" name="prefer" value="open-source-community">
                <label for="open-source">Open Source Community</label>

                <input type="checkbox" id="gitter" name="prefer" value="gitter-help-rooms">
                <label for="gitter">Gitter help rooms</label>

                <input type="checkbox" id="videos" name="prefer" value="videos">
                <label for="videos">Videos</label>

                <input type="checkbox" id="city-meetups" name="prefer" value="city-meetups">
                <label for="city-meetups">City Meetups</label>

                <input type="checkbox" id="wiki" name="prefer" value="wiki">
                <label for="wiki">Wiki</label>

                <input type="checkbox" id="forum" name="prefer" value="forum">
                <label for="forum">Forum</label>

                <input type="checkbox" id="courses" name="prefer" value="additional-courses">
                <label for="courses">Additional Courses</label>
            </p>
        </fieldset>
        <div>
            <label for="comments">Any comments or suggestions?</label>
            <textarea id="comments" name="comments" rows="10" cols="40" placeholder="Enter your comment here"></textarea>
        </div>
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>

</body>

</html>
